name: Yiju release gate (production deployment)

on:
  push:
    branches:
      - 'claude/livable-cities-ranking-0112UFYCzLLMXat6n8Tjc83c'
  pull_request:
    branches:
      - 'claude/livable-cities-ranking-0112UFYCzLLMXat6n8Tjc83c'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yiju-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies in isolated CI
        run: npm ci --no-audit --no-fund
      - name: Production patch reconciliation regression
        run: node tests_js/production-patch-reconciliation.test.js
      - name: City data and admin regressions
        run: npm run test:city-data
      - name: Verified living checklist page and SEO regression
        run: node --test tests_js/yiju-d03-living-checklist.test.js tests_js/yiju-d04-atlas.test.js tests_js/yiju-d10-return-visit-checklist.test.js
      - name: D05 sourced detail facts, photo license and field-review regressions
        run: node --test tests_js/yiju-d05-official-city-detail.test.js
      - name: D06 first-visit practical browsing and honest city fields
        run: node --test tests_js/yiju-first-visit.test.js
      - name: D07 sourced new city facts and comparison guide
        run: node --test tests_js/yiju-d07-new-city-data.test.js tests_js/yiju-d11-siping-panjin-facts.test.js
      - name: D08 editorial provenance and rent claims guard
        run: node --test tests_js/yiju-d08-featured-trust.test.js
      - name: D10 featured rotation and visible rent-tag trust regressions
        run: node --test tests_js/yiju-d10-featured-rotation.test.js tests_js/yiju-d10-trust-tags.test.js
      - name: Read-only external production API snapshot (diagnostic, never a release approval)
        if: ${{ matrix['node-version'] == '22' }}
        continue-on-error: true
        run: node scripts/ops/yiju_public_api_probe.mjs
      - name: Full city quality audit read-only regression (synthetic, no production fetch)
        run: node --test tests_js/yiju-city-quality-audit.test.js
      - name: All-city coverage inventory logic regression (synthetic)
        run: node --test tests_js/yiju-all-city-coverage.test.mjs
      - name: Read-only ALL production cities inventory (diagnostic)
        if: ${{ matrix['node-version'] == '22' }}
        continue-on-error: true
        run: node scripts/ops/yiju_all_city_coverage.mjs
      - name: Keep all-city public inventory artifact for human source/photo verification
        if: ${{ matrix['node-version'] == '22' }}
        uses: actions/upload-artifact@v4
        with:
          name: yiju-all-city-coverage
          path: artifacts/yiju-all-city-coverage.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Real isolated SQLite regression
        run: npm run test:city-data:sqlite
      - name: SEO, pagination and canonical regressions
        run: node --test tests_js/seo-sitemap.test.js tests_js/seo-live-links.test.js tests_js/layflat-pagination.test.js
      - name: Official city facts page and sitemap discovery regression
        run: node --test tests_js/official-city-facts.test.js
      - name: SEO sitemap regression in production Asia/Shanghai timezone
        env:
          TZ: Asia/Shanghai
        run: node --test tests_js/seo-sitemap.test.js
      - name: Safe deployment poller compiles and standard-library tests pass
        run: |
          python3 -m py_compile scripts/deploy/yiju_auto_deploy.py scripts/deploy/bootstrap_yiju_autodeploy.py
          python3 -m unittest discover -s tests_py -p 'test_yiju_*.py' -v
