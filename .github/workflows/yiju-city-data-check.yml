name: Yiju city data checks
on:
  pull_request:
    paths:
      - 'server/routes/auth.js'
      - 'tests_js/auth-me.test.js'
      - 'public/admin.html'
      - 'public/city-data-management.js'
      - 'server/routes/city-data-management.js'
      - 'server/routes/city-agent-bridge.js'
      - 'server/routes/cities.js'
      - 'tests_js/layflat-pagination.test.js'
      - 'tests_js/city-agent-bridge.test.js'
      - 'tests_js/city-agent-sqlite.integration.test.js'
      - 'tests_js/city-evidence-ui.test.js'
      - 'package-lock.json'
      - 'docs/yiju-agent-actions.openapi.yaml'
      - 'docs/yiju-gpt-bridge-deploy.md'
      - '.env.example'
      - 'server.js'
      - 'tests_js/city-data-management.test.js'
      - 'package.json'
      - '.github/workflows/yiju-city-data-check.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check city management workflows
        run: npm run test:city-data
      - name: Check deterministic city pagination
        run: node --test tests_js/layflat-pagination.test.js
      - run: npm ci --no-audit --no-fund
      - name: Verify real SQLite, HTTP, authorization and autonomous safety gates
        run: npm run test:city-data:sqlite
