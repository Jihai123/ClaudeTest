# Nginx配置示例 - www.chatgpt5x.com
# 放置位置: /etc/nginx/sites-available/chatgpt5x.com
# 或: /www/server/panel/vhost/nginx/

server {
    listen 80;
    listen [::]:80;
    server_name www.chatgpt5x.com chatgpt5x.com;

    # 如果使用宝塔面板，SSL配置会自动添加在这里
    
    # 网站根目录 - 静态文件
    root /www/wwwroot/yijucity/ClaudeTest/public;
    index index.html;

    # 访问日志
    access_log /www/wwwlogs/chatgpt5x.com.log;
    error_log /www/wwwlogs/chatgpt5x.com.error.log;

    # 静态文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API代理 - 根路径
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;

        # 必需的headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket支持（如果需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API代理 - 子路径 /livablecities/api/
    location /livablecities/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;

        # 必需的headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket支持（如果需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
