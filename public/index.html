<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宜居城市指南 - 找到你的理想城市</title>
    <meta name="description" content="探索中国宜居城市排行榜，发现最适合躺平、养老、旅居的理想城市">
    <meta name="keywords" content="宜居城市,城市排行榜,躺平城市,养老城市,低房租城市">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>">

    <style>
        /* ===== CSS Reset & Variables ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;

            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;

            --white: #ffffff;
            --black: #000000;

            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);

            --radius-sm: 0.375rem;
            --radius: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-2xl: 1.5rem;
            --radius-full: 9999px;

            --transition: all 0.2s ease;
            --transition-slow: all 0.3s ease;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                         'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--gray-50);
            color: var(--gray-900);
            line-height: 1.6;
            min-height: 100vh;
        }

        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; }
        img { max-width: 100%; height: auto; }

        /* ===== Navigation ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--gray-200);
            transition: var(--transition);
        }

        .navbar.scrolled { box-shadow: var(--shadow-md); }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gray-900);
            flex-shrink: 0;
        }

        .logo-icon { font-size: 1.5rem; }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .nav-link {
            padding: 0.5rem 0.875rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray-600);
            border-radius: var(--radius);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .nav-link:hover {
            color: var(--gray-900);
            background: var(--gray-100);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: var(--radius-full);
            border: none;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: transparent;
            color: var(--gray-600);
        }

        .btn-ghost:hover {
            background: var(--gray-100);
            color: var(--gray-900);
        }

        .btn-outline {
            background: var(--white);
            border: 1px solid var(--gray-300);
            color: var(--gray-700);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .mobile-menu-btn {
            display: none;
            padding: 0.5rem;
            background: none;
            border: none;
            font-size: 1.25rem;
        }

        /* ===== Hero Section ===== */
        .hero {
            padding: 6rem 1.5rem 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }

        .hero-container {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .hero-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            color: var(--white);
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        .hero-subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 1.5rem;
        }

        /* Search Box */
        .search-box {
            max-width: 560px;
            margin: 0 auto 1.5rem;
            position: relative;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 0.875rem 1.25rem 0.875rem 3rem;
            font-size: 1rem;
            border: none;
            border-radius: var(--radius-2xl);
            background: var(--white);
            box-shadow: var(--shadow-xl);
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .search-input::placeholder { color: var(--gray-400); }

        .search-icon {
            position: absolute;
            left: 1rem;
            color: var(--gray-400);
            font-size: 1.125rem;
        }

        .search-btn {
            position: absolute;
            right: 0.375rem;
            padding: 0.625rem 1.25rem;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-xl);
            font-weight: 600;
            transition: var(--transition);
        }

        .search-btn:hover { background: var(--primary-dark); }

        /* Quick Tags - 与小程序一致 */
        .quick-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.625rem;
        }

        .quick-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.5rem 0.875rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-full);
            color: var(--white);
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .quick-tag:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .quick-tag.active {
            background: var(--white);
            color: var(--primary);
        }

        /* ===== Main Content ===== */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        /* Section Header */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .section-title {
            font-size: 1.375rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-more {
            font-size: 0.875rem;
            color: var(--primary);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .section-more:hover { color: var(--primary-dark); }

        /* ===== Featured Carousel ===== */
        .featured-section { margin-bottom: 3rem; }

        .carousel-container { position: relative; }

        .carousel-track {
            display: flex;
            gap: 1.25rem;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 0.5rem 0;
        }

        .carousel-track::-webkit-scrollbar { display: none; }

        .featured-card {
            flex: 0 0 calc(33.333% - 0.875rem);
            min-width: 280px;
            scroll-snap-align: start;
            background: var(--white);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition-slow);
        }

        .featured-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-xl);
        }

        .featured-card-image {
            position: relative;
            height: 180px;
            overflow: hidden;
        }

        .featured-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            position: relative;
            z-index: 2;
        }

        .featured-card:hover .featured-card-image img { transform: scale(1.05); }

        /* 占位符在最底层，图片加载成功后完全覆盖 */
        .featured-card-placeholder {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.4);
            z-index: 1;
        }

        .featured-card-badge {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            padding: 0.25rem 0.625rem;
            background: var(--white);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            z-index: 3;
        }

        .featured-card-score {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            padding: 0.25rem 0.625rem;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-full);
            color: var(--white);
            font-size: 0.8125rem;
            font-weight: 600;
            z-index: 3;
        }

        .featured-card-content { padding: 1rem; }

        .featured-card-name {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.125rem;
        }

        .featured-card-location {
            font-size: 0.8125rem;
            color: var(--gray-500);
            margin-bottom: 0.75rem;
        }

        .featured-card-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .featured-card-price {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
        }

        .featured-card-price span {
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--gray-500);
        }

        .featured-card-tags {
            display: flex;
            gap: 0.25rem;
        }

        .card-tag {
            padding: 0.125rem 0.375rem;
            background: var(--gray-100);
            border-radius: var(--radius-sm);
            font-size: 0.6875rem;
            color: var(--gray-600);
        }

        .carousel-nav {
            display: flex;
            gap: 0.5rem;
        }

        .carousel-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--white);
            border: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            transition: var(--transition);
        }

        .carousel-btn:hover:not(:disabled) {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--white);
        }

        .carousel-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== Budget Section ===== */
        .budget-section { margin-bottom: 3rem; }

        .budget-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .budget-card {
            background: var(--white);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-xl);
            padding: 1.25rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .budget-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .budget-card.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-color: var(--primary);
            color: var(--white);
        }

        .budget-icon {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .budget-label {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.125rem;
        }

        .budget-count {
            font-size: 0.8125rem;
            color: var(--gray-500);
        }

        .budget-card.active .budget-count {
            color: rgba(255, 255, 255, 0.8);
        }

        /* ===== Ranking Section ===== */
        .ranking-section { margin-bottom: 3rem; }

        .ranking-tabs {
            display: flex;
            gap: 0.375rem;
            margin-bottom: 1.25rem;
            background: var(--gray-100);
            padding: 0.25rem;
            border-radius: var(--radius-xl);
            width: fit-content;
        }

        .ranking-tab {
            padding: 0.5rem 1rem;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--gray-600);
            background: transparent;
            border: none;
            border-radius: var(--radius-lg);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .ranking-tab:hover { color: var(--gray-900); }

        .ranking-tab.active {
            background: var(--white);
            color: var(--primary);
            box-shadow: var(--shadow);
        }

        /* City Grid */
        .cities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.25rem;
        }

        .city-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition-slow);
        }

        .city-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .city-card-image {
            position: relative;
            height: 140px;
            overflow: hidden;
        }

        .city-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            position: relative;
            z-index: 2;
        }

        .city-card:hover .city-card-image img { transform: scale(1.05); }

        .city-card-placeholder {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.4);
            z-index: 1;
        }

        .city-card-rank {
            position: absolute;
            top: 0.625rem;
            left: 0.625rem;
            width: 28px;
            height: 28px;
            background: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8125rem;
            font-weight: 700;
            color: var(--gray-700);
            z-index: 3;
        }

        .city-card-rank.top-1 {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: var(--white);
        }

        .city-card-rank.top-2 {
            background: linear-gradient(135deg, #9ca3af 0%, #6b7280 100%);
            color: var(--white);
        }

        .city-card-rank.top-3 {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: var(--white);
        }

        .city-card-score {
            position: absolute;
            bottom: 0.625rem;
            right: 0.625rem;
            padding: 0.25rem 0.625rem;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-full);
            color: var(--white);
            font-size: 0.8125rem;
            font-weight: 600;
            z-index: 3;
        }

        .city-card-body { padding: 1rem; }

        .city-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .city-card-name {
            font-size: 1.125rem;
            font-weight: 700;
        }

        .city-card-location {
            font-size: 0.8125rem;
            color: var(--gray-500);
        }

        .city-card-price {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--primary);
        }

        .city-card-price span {
            font-size: 0.6875rem;
            font-weight: 400;
            color: var(--gray-500);
        }

        .city-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-bottom: 0.75rem;
        }

        .city-card-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--gray-100);
        }

        .city-stat { text-align: center; }

        .city-stat-value {
            font-size: 0.9375rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .city-stat-label {
            font-size: 0.6875rem;
            color: var(--gray-500);
        }

        /* ===== Loading & Empty States ===== */
        .loading {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 0.75rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }

        .empty-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
        }

        .empty-desc { color: var(--gray-500); }

        /* Load More Button */
        .load-more {
            text-align: center;
            margin-top: 1.5rem;
        }

        .load-more-btn {
            padding: 0.625rem 1.5rem;
            background: var(--white);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-full);
            font-weight: 600;
            color: var(--gray-700);
            transition: var(--transition);
        }

        .load-more-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ===== Filter Drawer ===== */
        .filter-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1999;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .filter-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .filter-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            max-width: 100%;
            height: 100vh;
            background: var(--white);
            z-index: 2000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .filter-drawer.active { right: 0; }

        .filter-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--gray-100);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .filter-title {
            font-size: 1rem;
            font-weight: 700;
        }

        .filter-close {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--gray-100);
            border: none;
            font-size: 1.125rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .filter-close:hover { background: var(--gray-200); }

        .filter-body {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
        }

        .filter-group { margin-bottom: 1.5rem; }
        .filter-group:last-child { margin-bottom: 0; }

        .filter-group-title {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.625rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-option {
            padding: 0.375rem 0.875rem;
            background: var(--gray-100);
            border: 1px solid transparent;
            border-radius: var(--radius-full);
            font-size: 0.8125rem;
            color: var(--gray-700);
            transition: var(--transition);
        }

        .filter-option:hover { background: var(--gray-200); }

        .filter-option.active {
            background: var(--primary);
            color: var(--white);
        }

        .filter-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--gray-100);
            display: flex;
            gap: 0.625rem;
        }

        .filter-footer .btn {
            flex: 1;
            padding: 0.625rem;
        }

        /* ===== Modal ===== */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: var(--white);
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 380px;
            padding: 1.75rem;
            position: relative;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-close {
            position: absolute;
            top: 0.875rem;
            right: 0.875rem;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--gray-100);
            border: none;
            font-size: 1.125rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-close:hover { background: var(--gray-200); }

        .modal-title {
            font-size: 1.375rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
        }

        .form-group { margin-bottom: 0.875rem; }

        .form-label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 0.375rem;
        }

        .form-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 0.9375rem;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* ===== Notification ===== */
        .notification {
            position: fixed;
            top: 4.5rem;
            right: 1.25rem;
            padding: 0.875rem 1.25rem;
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            border-left: 4px solid var(--primary);
            z-index: 4000;
            transform: translateX(calc(100% + 2rem));
            transition: transform 0.3s ease;
        }

        .notification.show { transform: translateX(0); }
        .notification.success { border-left-color: var(--success); }
        .notification.error { border-left-color: var(--danger); }

        /* ===== Footer ===== */
        .footer {
            background: var(--gray-900);
            color: var(--gray-400);
            padding: 2.5rem 1.5rem;
            margin-top: 3rem;
        }

        .footer-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: var(--white);
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
        }

        .footer-link {
            font-size: 0.8125rem;
            transition: var(--transition);
        }

        .footer-link:hover { color: var(--white); }

        /* ===== Responsive ===== */
        @media (max-width: 1024px) {
            .featured-card { flex: 0 0 calc(50% - 0.625rem); }
            .budget-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .nav-links .nav-link.hide-mobile { display: none; }

            .hero { padding: 5rem 1rem 2rem; }

            }

            .cities-grid { grid-template-columns: 1fr; }

            .footer-container {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>

    <script>
        // ===== Configuration =====
        const API_BASE = (() => {
            const path = window.location.pathname;
            if (path.includes('/yiju')) return window.location.origin + '/yiju';
            if (path.includes('/livablecities')) return window.location.origin + '/livablecities';
            return window.location.origin;
        })();

        const R2_IMAGE_BASE = 'https://cityimg.zhibeimao.com/city_images';

        // ===== State =====
        const state = {
            currentList: 'china_layflat',
            cities: [],
            featuredCities: [],
            page: 1,
            limit: 12,
            loading: false,
            hasMore: true,
            filters: {
                search: '',
                rent: null,
                region: null,
                tier: null,
                features: [],
                quickFilter: null
            }
        };

        // ===== API Functions =====
        async function fetchAPI(endpoint) {
            const url = `${API_BASE}${endpoint}`;
            console.log('API Request:', url);
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }

        // ===== City Image Helper =====
        function getCityImageUrl(city) {
            if (city.cover_image && city.cover_image.image_url) {
                return city.cover_image.image_url;
            }
            return `${R2_IMAGE_BASE}/${city.id}/${city.id}_1.jpeg`;
        }

        function getGradientStyle(index) {
            const gradients = [
                'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
                'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
                'linear-gradient(135deg, #d299c2 0%, #fef9d7 100%)',
                'linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%)'
            ];
            return gradients[index % gradients.length];
        }

        // ===== Navigation =====
        function goToCity(id) {
            window.location.href = `city-detail.html?id=${id}`;
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            setTimeout(() => notification.classList.remove('show'), 3000);
        }

        // ===== Load Data =====
        async function loadFeaturedCities() {
            try {
                const data = await fetchAPI('/api/cities/hot?type=featured&limit=9');
                if (data.cities) {
                    state.featuredCities = data.cities;
                    renderFeaturedCities();
                }
            } catch (error) {
                console.error('加载推荐城市失败:', error);
            }
        }

        async function loadCities(reset = false) {
            if (state.loading) return;

            const loading = document.getElementById('loading');
            const citiesGrid = document.getElementById('citiesGrid');
            const emptyState = document.getElementById('emptyState');
            const loadMore = document.getElementById('loadMore');

            if (reset) {
                state.page = 1;
                state.hasMore = true;
                citiesGrid.innerHTML = '';
            }

            state.loading = true;
            loading.style.display = reset ? 'block' : 'none';
            emptyState.style.display = 'none';

            try {
                const params = new URLSearchParams({
                    page: state.page,
                    limit: state.limit,
                    list_type: state.currentList
                });

                if (state.filters.search) {
                    params.append('search', state.filters.search);
                }

                const data = await fetchAPI(`/api/cities?${params}`);

                if (data.cities && data.cities.length > 0) {
                    state.cities = reset ? data.cities : [...state.cities, ...data.cities];
                    state.hasMore = data.cities.length >= state.limit;
                    renderCities(data.cities, reset);
                    loadMore.style.display = state.hasMore ? 'block' : 'none';
                } else {
                    if (reset) emptyState.style.display = 'block';
                    state.hasMore = false;
                    loadMore.style.display = 'none';
                }
            } catch (error) {
                console.error('加载城市失败:', error);
                showNotification('加载失败，请稍后再试', 'error');
                if (reset) emptyState.style.display = 'block';
            } finally {
                state.loading = false;
                loading.style.display = 'none';
            }
        }

        // ===== Render Functions =====
        function renderFeaturedCities() {
            const track = document.getElementById('carouselTrack');
            track.innerHTML = state.featuredCities.map((city, index) => {
                const score = (city.layflat_score || city.overall_score || 0).toFixed(1);
                const rent = city.avg_rent ? `¥${city.avg_rent}` : '暂无';
                const imageUrl = getCityImageUrl(city);
                const gradient = getGradientStyle(index);

                const tags = [];
                if (city.tags && city.tags.length > 0) {
                    city.tags.slice(0, 2).forEach(t => tags.push(t.tag_name));
                } else {
                    if (city.avg_rent && city.avg_rent < 1000) tags.push('低成本');
                    if (city.air_quality >= 7) tags.push('空气好');
                }

                return `
                    <div class="featured-card" data-city-id="${city.id}">
                        <div class="featured-card-image" style="background: ${gradient}">
                            <div class="featured-card-placeholder">${city.name[0]}</div>
                            <img src="${imageUrl}" alt="${city.name}" onload="this.style.opacity=1" onerror="this.style.display='none'" style="opacity:0;transition:opacity 0.3s">
                            <div class="featured-card-badge">#${index + 1}</div>
                            <div class="featured-card-score">⭐ ${score}</div>
                        </div>
                        <div class="featured-card-content">
                            <div class="featured-card-name">${city.name}</div>
                            <div class="featured-card-location">${city.province || ''}</div>
                            <div class="featured-card-info">
                                <div class="featured-card-price">${rent}<span>/月</span></div>
                                <div class="featured-card-tags">
                                    ${tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // 绑定点击事件
            track.querySelectorAll('.featured-card').forEach(card => {
                card.addEventListener('click', () => {
                    const cityId = card.dataset.cityId;
                    if (cityId) goToCity(cityId);
                });
            });
        }

        function renderCities(cities, reset = false) {
            const grid = document.getElementById('citiesGrid');
            if (reset) grid.innerHTML = '';

            const startIndex = reset ? 0 : state.cities.length - cities.length;

            cities.forEach((city, i) => {
                const index = startIndex + i;
                const rank = index + 1;

                let score;
                if (state.currentList === 'china_layflat') {
                    score = city.layflat_score || city.overall_score || 0;
                } else if (state.currentList === 'world') {
                    score = city.world_score || city.overall_score || 0;
                } else {
                    score = city.overall_score || 0;
                }
                score = score.toFixed(1);

                const rent = city.avg_rent ? `¥${city.avg_rent}` : '暂无';
                const imageUrl = getCityImageUrl(city);
                const gradient = getGradientStyle(index);

                const tags = [];
                if (city.tags && city.tags.length > 0) {
                    city.tags.slice(0, 3).forEach(t => tags.push(t.tag_name));
                } else {
                    if (city.avg_rent && city.avg_rent < 1000) tags.push('低成本');
                    if (city.air_quality >= 7) tags.push('空气好');
                    if (city.elderly_care >= 7) tags.push('适合养老');
                }

                const air = (city.air_quality || 0).toFixed(1);
                const medical = (city.medical_facilities || 0).toFixed(1);
                const living = (city.living_cost || 0).toFixed(1);
                const rankClass = rank <= 3 ? `top-${rank}` : '';

                const card = document.createElement('div');
                card.className = 'city-card';
                card.dataset.cityId = city.id;
                card.innerHTML = `
                    <div class="city-card-image" style="background: ${gradient}">
                        <div class="city-card-placeholder">${city.name[0]}</div>
                        <img src="${imageUrl}" alt="${city.name}" onload="this.style.opacity=1" onerror="this.style.display='none'" style="opacity:0;transition:opacity 0.3s">
                        <div class="city-card-rank ${rankClass}">${rank}</div>
                        <div class="city-card-score">⭐ ${score}</div>
                    </div>
                    <div class="city-card-body">
                        <div class="city-card-header">
                            <div>
                                <div class="city-card-name">${city.name}</div>
                                <div class="city-card-location">${city.province || city.country || ''}</div>
                            </div>
                            <div class="city-card-price">${rent}<span>/月</span></div>
                        </div>
                        <div class="city-card-tags">
                            ${tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
                        </div>
                        <div class="city-card-stats">
                            <div class="city-stat">
                                <div class="city-stat-value">${air}</div>
                                <div class="city-stat-label">空气</div>
                            </div>
                            <div class="city-stat">
                                <div class="city-stat-value">${medical}</div>
                                <div class="city-stat-label">医疗</div>
                            </div>
                            <div class="city-stat">
                                <div class="city-stat-value">${living}</div>
                                <div class="city-stat-label">生活</div>
                            </div>
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => goToCity(city.id));
                grid.appendChild(card);
            });
        }

        // ===== Filter Functions =====
        function openFilterDrawer() {
            document.getElementById('filterOverlay').classList.add('active');
            document.getElementById('filterDrawer').classList.add('active');
        }

        function closeFilterDrawer() {
            document.getElementById('filterOverlay').classList.remove('active');
            document.getElementById('filterDrawer').classList.remove('active');
        }

        function applyFilters() {
            document.querySelectorAll('.filter-options').forEach(group => {
                const type = group.dataset.filterType;
                const activeOptions = group.querySelectorAll('.filter-option.active');

                if (type === 'features') {
                    state.filters.features = Array.from(activeOptions).map(o => o.dataset.value);
                } else if (activeOptions.length > 0) {
                    state.filters[type] = activeOptions[0].dataset.value;
                } else {
                    state.filters[type] = null;
                }
            });

            closeFilterDrawer();
            loadCities(true);
        }

        function resetFilters() {
            state.filters = {
                search: '',
                rent: null,
                region: null,
                tier: null,
                features: [],
                quickFilter: null
            };

            document.querySelectorAll('.filter-option').forEach(o => o.classList.remove('active'));
            document.querySelectorAll('.quick-tag').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.budget-card').forEach(c => c.classList.remove('active'));
            document.getElementById('heroSearchInput').value = '';

            closeFilterDrawer();
            loadCities(true);
        }

        // ===== Quick Filter Handler =====
        function handleQuickFilter(type) {
            // 根据快捷筛选类型跳转到对应页面或设置筛选
            switch (type) {
                case 'recommend':
                    // 跳转到推荐页面
                    window.location.href = 'recommend.html';
                    break;
                case 'lowCost':
                    state.filters.rent = '0-1000';
                    loadCities(true);
                    document.getElementById('ranking').scrollIntoView({ behavior: 'smooth' });
                    break;
                case 'elderly':
                    state.filters.features = ['elderly_friendly'];
                    loadCities(true);
                    document.getElementById('ranking').scrollIntoView({ behavior: 'smooth' });
                    break;
                case 'employment':
                    state.filters.features = ['employment'];
                    loadCities(true);
                    document.getElementById('ranking').scrollIntoView({ behavior: 'smooth' });
                    break;
                case 'airQuality':
                    state.filters.features = ['air_quality'];
                    loadCities(true);
                    document.getElementById('ranking').scrollIntoView({ behavior: 'smooth' });
                    break;
                case 'coastal':
                    state.filters.features = ['coastal'];
                    loadCities(true);
                    document.getElementById('ranking').scrollIntoView({ behavior: 'smooth' });
                    break;
            }
        }

        // ===== Event Listeners =====
        function initEventListeners() {
            // Navbar scroll effect
            window.addEventListener('scroll', () => {
                document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 10);
            });

            // Search
            const heroSearchInput = document.getElementById('heroSearchInput');
            const heroSearchBtn = document.getElementById('heroSearchBtn');

            heroSearchBtn.addEventListener('click', () => {
                state.filters.search = heroSearchInput.value.trim();
                loadCities(true);
                document.getElementById('ranking').scrollIntoView({ behavior: 'smooth' });
            });

            heroSearchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') heroSearchBtn.click();
            });

            // Quick Tags - 与小程序保持一致
            document.querySelectorAll('.quick-tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    const filter = tag.dataset.filter;
                    const isActive = tag.classList.contains('active');

                    document.querySelectorAll('.quick-tag').forEach(t => t.classList.remove('active'));

                    if (!isActive) {
                        tag.classList.add('active');
                        state.filters.quickFilter = filter;
                        handleQuickFilter(filter);
                    } else {
                        state.filters.quickFilter = null;
                        state.filters.features = [];
                        state.filters.rent = null;
                        loadCities(true);
                    }
                });
            });

            // Budget Cards
            document.querySelectorAll('.budget-card').forEach(card => {
                card.addEventListener('click', () => {
                    const budget = card.dataset.budget;
                    const isActive = card.classList.contains('active');

                    document.querySelectorAll('.budget-card').forEach(c => c.classList.remove('active'));

                    if (!isActive) {
                        card.classList.add('active');
                        state.filters.rent = budget;
                    } else {
                        state.filters.rent = null;
                    }

                    loadCities(true);
                });
            });

            // Ranking Tabs
            document.querySelectorAll('.ranking-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.ranking-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    state.currentList = tab.dataset.list;
                    // 切换榜单时重置筛选
                    state.filters.rent = null;
                    state.filters.features = [];
                    document.querySelectorAll('.budget-card').forEach(c => c.classList.remove('active'));
                    document.querySelectorAll('.quick-tag').forEach(t => t.classList.remove('active'));
                    loadCities(true);
                });
            });

            // Carousel Navigation
            const carouselTrack = document.getElementById('carouselTrack');
            document.getElementById('carouselPrev').addEventListener('click', () => {
                carouselTrack.scrollBy({ left: -300, behavior: 'smooth' });
            });
            document.getElementById('carouselNext').addEventListener('click', () => {
                carouselTrack.scrollBy({ left: 300, behavior: 'smooth' });
            });

            // Filter Drawer
            document.getElementById('filterBtn').addEventListener('click', openFilterDrawer);
            document.getElementById('filterOverlay').addEventListener('click', closeFilterDrawer);
            document.getElementById('filterClose').addEventListener('click', closeFilterDrawer);
            document.getElementById('applyFilters').addEventListener('click', applyFilters);
            document.getElementById('resetFilters').addEventListener('click', resetFilters);

            // Filter Options
            document.querySelectorAll('.filter-option').forEach(option => {
                option.addEventListener('click', () => {
                    const parent = option.closest('.filter-options');
                    const type = parent.dataset.filterType;

                    if (type === 'features') {
                        option.classList.toggle('active');
                    } else {
                        parent.querySelectorAll('.filter-option').forEach(o => {
                            if (o !== option) o.classList.remove('active');
                        });
                        option.classList.toggle('active');
                    }
                });
            });

            // Load More
            document.getElementById('loadMoreBtn').addEventListener('click', () => {
                state.page++;
                loadCities(false);
            });

            // Login Modal
            document.getElementById('loginBtn').addEventListener('click', () => {
                document.getElementById('loginModal').classList.add('show');
            });
            document.getElementById('closeLoginModal').addEventListener('click', () => {
                document.getElementById('loginModal').classList.remove('show');
            });
            document.getElementById('loginModal').addEventListener('click', (e) => {
                if (e.target.id === 'loginModal') {
                    document.getElementById('loginModal').classList.remove('show');
                }
            });

            // View All Ranking
            document.getElementById('viewAllRanking').addEventListener('click', () => {
                window.location.href = 'city-ranking.html';
            });
        }

        // ===== Initialize =====
        async function init() {
            console.log('🚀 初始化应用...');
            console.log('API Base:', API_BASE);

            initEventListeners();

            await Promise.all([
                loadFeaturedCities(),
                loadCities(true)
            ]);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
