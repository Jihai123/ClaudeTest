<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宜居城市指南 - 找到你的理想城市</title>
    <meta name="description" content="极简卡片风格，智能搜索，快速找到最适合你的宜居城市">
    <meta name="keywords" content="宜居城市,城市排行榜,低房租,生活成本,城市对比">

    <style>
        /* ===== 全局重置和基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 极简配色 */
            --color-primary: #2563eb;
            --color-primary-hover: #1d4ed8;
            --color-text: #111827;
            --color-text-secondary: #6b7280;
            --color-text-muted: #9ca3af;
            --color-bg: #ffffff;
            --color-bg-secondary: #f9fafb;
            --color-bg-tertiary: #f3f4f6;
            --color-border: #e5e7eb;
            --color-border-light: #f3f4f6;

            /* 阴影 */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);

            /* 圆角 */
            --radius-sm: 0.375rem;
            --radius: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-2xl: 1.5rem;
            --radius-full: 9999px;

            /* 间距 */
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
            --spacing-2xl: 4rem;
            --spacing-3xl: 6rem;

            /* 动画 */
            --transition: all 0.2s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                         'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--color-bg-secondary);
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ===== 导航栏 - 极简风格 ===== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--color-border-light);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-lg);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-text);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .logo:hover {
            opacity: 0.7;
        }

        .logo-icon {
            font-size: 1.5rem;
        }

        /* 导航搜索框 */
        .nav-search {
            flex: 1;
            max-width: 480px;
            position: relative;
        }

        .nav-search-input {
            width: 100%;
            padding: 0.625rem var(--spacing-sm) 0.625rem 2.75rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-full);
            background: var(--color-bg);
            font-size: 0.9375rem;
            color: var(--color-text);
            transition: var(--transition);
        }

        .nav-search-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .nav-search-input::placeholder {
            color: var(--color-text-muted);
        }

        .nav-search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
            pointer-events: none;
        }

        /* 导航操作按钮 */
        .nav-actions {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .nav-link {
            padding: 0.5rem var(--spacing-sm);
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.9375rem;
            font-weight: 500;
            border-radius: var(--radius);
            transition: var(--transition);
            white-space: nowrap;
        }

        .nav-link:hover {
            color: var(--color-text);
            background: var(--color-bg-tertiary);
        }

        .btn-login {
            padding: 0.5rem var(--spacing-md);
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-full);
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-login:hover {
            background: var(--color-primary-hover);
            transform: translateY(-1px);
        }

        .filter-toggle-btn {
            padding: 0.5rem;
            background: var(--color-bg-tertiary);
            border: none;
            border-radius: var(--radius);
            color: var(--color-text);
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }

        .filter-toggle-btn:hover {
            background: var(--color-border);
        }

        /* 移动端菜单按钮 */
        .mobile-menu-btn {
            display: none;
            padding: 0.5rem;
            background: none;
            border: none;
            color: var(--color-text);
            cursor: pointer;
        }

        /* ===== Hero区域 - 全屏设计 ===== */
        .hero {
            min-height: calc(100vh - 72px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-3xl) var(--spacing-lg);
            background: linear-gradient(180deg, #ffffff 0%, var(--color-bg-secondary) 100%);
            position: relative;
        }

        .hero-content {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        .hero-title {
            font-size: 3.75rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: var(--spacing-md);
            letter-spacing: -0.02em;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-2xl);
        }

        /* 智能搜索框 */
        .hero-search {
            margin-bottom: var(--spacing-xl);
        }

        .search-wrapper {
            position: relative;
            max-width: 700px;
            margin: 0 auto var(--spacing-md);
        }

        .search-input {
            width: 100%;
            padding: 1.25rem 11rem 1.25rem 3.5rem;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-2xl);
            font-size: 1.125rem;
            background: var(--color-bg);
            box-shadow: var(--shadow-xl);
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 20px 40px -10px rgba(37, 99, 235, 0.15);
        }

        .search-input::placeholder {
            color: var(--color-text-muted);
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
            font-size: 1.5rem;
        }

        .search-btn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            padding: 0.75rem 2rem;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-xl);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-btn:hover {
            background: var(--color-primary-hover);
        }

        /* 搜索提示 */
        .search-hints {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            font-size: 0.875rem;
            color: var(--color-text-muted);
            flex-wrap: wrap;
        }

        .hint-tag {
            padding: 0.25rem 0.75rem;
            background: var(--color-bg-tertiary);
            border: none;
            border-radius: var(--radius-full);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.875rem;
        }

        .hint-tag:hover {
            background: var(--color-border);
            color: var(--color-text);
        }

        /* 快捷筛选标签 - 参考小程序 */
        .quick-filters {
            max-width: 900px;
            margin: 0 auto;
        }

        .filters-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-md);
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-text-secondary);
        }

        .filters-grid {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            justify-content: center;
        }

        .filter-tag {
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--color-bg);
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-xl);
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--color-text);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        .filter-tag:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .filter-tag.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }

        /* ===== 主内容容器 ===== */
        .main-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: var(--spacing-3xl) var(--spacing-lg);
        }

        /* ===== 推荐城市轮播 - 3张大卡片 ===== */
        .featured-section {
            margin-bottom: var(--spacing-3xl);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-lg);
        }

        .section-title {
            font-size: 1.875rem;
            font-weight: 700;
        }

        .carousel-controls {
            display: flex;
            gap: var(--spacing-sm);
        }

        .carousel-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .carousel-btn:hover {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }

        .carousel-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .carousel-btn:disabled:hover {
            background: var(--color-bg);
            border-color: var(--color-border);
            color: var(--color-text);
        }

        .carousel-wrapper {
            position: relative;
            overflow: hidden;
        }

        .carousel-track {
            display: flex;
            gap: var(--spacing-lg);
            transition: transform 0.5s ease;
        }

        .featured-card {
            flex: 0 0 calc(33.333% - var(--spacing-lg) * 2 / 3);
            background: var(--color-bg);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
        }

        .featured-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-xl);
        }

        .featured-card-image {
            width: 100%;
            height: 240px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
        }

        .featured-card-badge {
            position: absolute;
            top: var(--spacing-md);
            right: var(--spacing-md);
            padding: 0.375rem var(--spacing-sm);
            background: rgba(255, 255, 255, 0.95);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--color-primary);
        }

        .featured-card-content {
            padding: var(--spacing-lg);
        }

        .featured-card-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: var(--spacing-xs);
        }

        .featured-card-location {
            color: var(--color-text-secondary);
            font-size: 0.9375rem;
            margin-bottom: var(--spacing-md);
        }

        .featured-card-price {
            font-size: 2rem;
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: var(--spacing-sm);
        }

        .featured-card-stats {
            display: flex;
            gap: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--color-border-light);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        /* ===== 按预算浏览 ===== */
        .budget-section {
            margin-bottom: var(--spacing-3xl);
        }

        .budget-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--spacing-md);
        }

        .budget-card {
            background: var(--color-bg);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .budget-card:hover {
            border-color: var(--color-primary);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .budget-card.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }

        .budget-icon {
            font-size: 2.5rem;
            margin-bottom: var(--spacing-sm);
        }

        .budget-label {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
        }

        .budget-desc {
            font-size: 0.875rem;
            color: var(--color-text-muted);
        }

        .budget-card.active .budget-desc {
            color: rgba(255, 255, 255, 0.8);
        }

        /* ===== 城市网格 - 瀑布流 ===== */
        .cities-section {
            margin-bottom: var(--spacing-3xl);
        }

        .cities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-lg);
        }

        .city-card {
            background: var(--color-bg);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
        }

        .city-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .city-card-header {
            padding: var(--spacing-lg);
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.05) 0%, rgba(139, 92, 246, 0.05) 100%);
        }

        .city-card-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: var(--spacing-xs);
        }

        .city-card-location {
            font-size: 0.9375rem;
            color: var(--color-text-secondary);
        }

        .city-card-body {
            padding: var(--spacing-lg);
        }

        .city-card-price {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
        }

        .city-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-md);
        }

        .city-tag {
            padding: 0.25rem 0.625rem;
            background: var(--color-bg-tertiary);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            color: var(--color-text-secondary);
        }

        .city-card-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-sm);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--color-border-light);
        }

        .city-stat {
            text-align: center;
        }

        .city-stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-text);
        }

        .city-stat-label {
            font-size: 0.75rem;
            color: var(--color-text-muted);
        }

        /* ===== 侧边筛选抽屉 ===== */
        .filter-drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1999;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .filter-drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .filter-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            max-width: 90vw;
            height: 100vh;
            background: var(--color-bg);
            box-shadow: var(--shadow-xl);
            z-index: 2000;
            transition: right 0.3s ease;
            overflow-y: auto;
        }

        .filter-drawer.active {
            right: 0;
        }

        .filter-drawer-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--color-border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: var(--color-bg);
            z-index: 10;
        }

        .filter-drawer-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .filter-drawer-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--color-bg-tertiary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .filter-drawer-close:hover {
            background: var(--color-border);
        }

        .filter-drawer-body {
            padding: var(--spacing-lg);
        }

        .filter-group {
            margin-bottom: var(--spacing-xl);
        }

        .filter-group-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
        }

        .filter-option {
            padding: 0.5rem var(--spacing-sm);
            background: var(--color-bg-tertiary);
            border: 1px solid transparent;
            border-radius: var(--radius);
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-option:hover {
            background: var(--color-border);
        }

        .filter-option.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }

        .filter-drawer-footer {
            padding: var(--spacing-lg);
            border-top: 1px solid var(--color-border-light);
            position: sticky;
            bottom: 0;
            background: var(--color-bg);
            display: flex;
            gap: var(--spacing-sm);
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: var(--radius);
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-secondary {
            background: var(--color-bg-tertiary);
            color: var(--color-text);
        }

        .btn-secondary:hover {
            background: var(--color-border);
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--color-primary-hover);
        }

        /* ===== 加载和空状态 ===== */
        .loading {
            text-align: center;
            padding: var(--spacing-3xl);
            color: var(--color-text-muted);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto var(--spacing-md);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-3xl);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: var(--spacing-md);
        }

        .empty-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: var(--spacing-xs);
        }

        .empty-desc {
            color: var(--color-text-secondary);
        }

        /* ===== 响应式设计 ===== */
        @media (max-width: 1024px) {
            .featured-card {
                flex: 0 0 calc(50% - var(--spacing-lg) / 2);
            }

            .budget-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .nav-search {
                display: none;
            }

            .nav-link {
                display: none;
            }

            .filter-toggle-btn,
            .mobile-menu-btn {
                display: block;
            }

            .hero {
                min-height: auto;
                padding: var(--spacing-2xl) var(--spacing-md);
            }

            .hero-title {
                font-size: 2.5rem;
            }

            .hero-subtitle {
                font-size: 1rem;
            }

            .search-input {
                padding: 1rem 7rem 1rem 3rem;
                font-size: 1rem;
            }

            .search-btn {
                padding: 0.625rem 1.25rem;
                font-size: 0.875rem;
            }

            .featured-card {
                flex: 0 0 100%;
            }

            .budget-grid {
                grid-template-columns: 1fr;
            }

            .cities-grid {
                grid-template-columns: 1fr;
            }

            .main-content {
                padding: var(--spacing-lg) var(--spacing-md);
            }
        }

        /* ===== 模态框 ===== */
        .modal {
            position: fixed;
            z-index: 3000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--color-bg);
            padding: var(--spacing-xl);
            border-radius: var(--radius-xl);
            width: 90%;
            max-width: 450px;
            box-shadow: var(--shadow-xl);
            position: relative;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            right: var(--spacing-md);
            top: var(--spacing-md);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--color-bg-tertiary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: var(--color-text-secondary);
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--color-border);
            color: var(--color-text);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: var(--spacing-lg);
        }

        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-label {
            display: block;
            margin-bottom: var(--spacing-xs);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 0.625rem var(--spacing-sm);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            font-size: 0.9375rem;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* ===== 通知 ===== */
        .notification {
            position: fixed;
            top: 5rem;
            right: 2rem;
            background: var(--color-bg);
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            z-index: 4000;
            transform: translateX(500px);
            transition: transform 0.3s ease;
            border-left: 4px solid var(--color-primary);
            max-width: 350px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            border-left-color: #ef4444;
        }

        .notification.success {
            border-left-color: #10b981;
        }
    </style>
</head>

    <!-- 通知 -->

    <script>
        // API配置
        const API_CONFIG = {
            baseURL: window.API_BASE_URL || (() => {
                const pathname = window.location.pathname;
                const href = window.location.href;
                if (pathname.includes('/yiju') || href.includes('/yiju')) {
                    return window.location.origin + '/yiju';
                }
                if (pathname.includes('/livablecities') || href.includes('/livablecities')) {
                    return window.location.origin + '/livablecities';
                }
                return window.location.origin;
            })(),
            isDev: window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        };

        console.log('🚀 API配置:', API_CONFIG);

        // 全局状态
        let allCities = [];
        let filteredCities = [];
        let activeFilters = {
            search: '',
            quickFilter: null,
            budget: null,
            rent: null,
            region: null,
            tier: null,
            feature: null
        };
        let carouselIndex = 0;
        const carouselItemsPerPage = 3;

        // API请求辅助函数
        async function apiRequest(endpoint, options = {}) {
            const url = `${API_CONFIG.baseURL}${endpoint}`;
            console.log('API Request:', url);

            try {
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `HTTP ${response.status}: ${response.statusText}`);
                }

                return data;
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // 通知函数
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 初始化
        async function init() {
            console.log('初始化应用...');

            // 加载推荐城市
            await loadFeaturedCities();

            // 加载所有城市
            await loadAllCities();

            // 初始化事件监听
            initEventListeners();
        }

        // 加载推荐城市（用于轮播）
        async function loadFeaturedCities() {
            try {
                const data = await apiRequest('/api/cities/hot?type=featured&limit=9');

                if (data.cities && data.cities.length > 0) {
                    renderFeaturedCities(data.cities);
                }
            } catch (error) {
                console.error('加载推荐城市失败:', error);
            }
        }

        // 渲染推荐城市轮播
        function renderFeaturedCities(cities) {
            const track = document.getElementById('carouselTrack');
            track.innerHTML = '';

            cities.forEach((city, index) => {
                const card = createFeaturedCard(city, index + 1);
                track.appendChild(card);
            });

            updateCarousel();
        }

        // 创建推荐城市卡片
        function createFeaturedCard(city, rank) {
            const card = document.createElement('div');
            card.className = 'featured-card';

            const score = (city.layflat_score || city.overall_score || 0).toFixed(1);
            const rent = city.avg_rent || '暂无';

            // 随机渐变色
            const gradients = [
                'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            ];
            const gradient = gradients[rank % gradients.length];

            card.innerHTML = `
                <div class="featured-card-image" style="background: ${gradient}">
                    <div class="featured-card-badge">#${rank}</div>
                    <span style="font-size: 4rem;">🏙️</span>
                </div>
                <div class="featured-card-content">
                    <h3 class="featured-card-title">${city.name}</h3>
                    <p class="featured-card-location">${city.province || ''}</p>
                    <div class="featured-card-price">¥${rent}/月</div>
                    <div class="featured-card-stats">
                        <div class="stat-item">
                            <span>⭐</span>
                            <span>${score}分</span>
                        </div>
                        <div class="stat-item">
                            <span>👁️</span>
                            <span>${city.views_count || 0}</span>
                        </div>
                    </div>
                </div>
            `;

            card.onclick = () => {
                window.location.href = `city-detail.html?id=${city.id}`;
            };

            return card;
        }

        // 更新轮播位置
        function updateCarousel() {
            const track = document.getElementById('carouselTrack');
            const cards = track.querySelectorAll('.featured-card');
            const totalPages = Math.ceil(cards.length / carouselItemsPerPage);

            // 计算偏移量
            const cardWidth = cards[0]?.offsetWidth || 0;
            const gap = 24; // var(--spacing-lg) = 24px
            const offset = -(carouselIndex * (cardWidth + gap) * carouselItemsPerPage);

            track.style.transform = `translateX(${offset}px)`;

            // 更新按钮状态
            document.getElementById('carouselPrev').disabled = carouselIndex === 0;
            document.getElementById('carouselNext').disabled = carouselIndex >= totalPages - 1;
        }

        // 加载所有城市
        async function loadAllCities() {
            const loading = document.getElementById('loading');
            const citiesGrid = document.getElementById('citiesGrid');
            const emptyState = document.getElementById('emptyState');

            loading.style.display = 'block';
            citiesGrid.innerHTML = '';
            emptyState.style.display = 'none';

            try {
                const data = await apiRequest('/api/cities?limit=100&list_type=china_layflat');

                if (data.cities && data.cities.length > 0) {
                    allCities = data.cities;
                    filteredCities = [...allCities];
                    renderCities(filteredCities);
                } else {
                    emptyState.style.display = 'block';
                }
            } catch (error) {
                console.error('加载城市失败:', error);
                showNotification('加载失败，请稍后再试', 'error');
                emptyState.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }

        // 渲染城市网格
        function renderCities(cities) {
            const citiesGrid = document.getElementById('citiesGrid');
            const emptyState = document.getElementById('emptyState');

            citiesGrid.innerHTML = '';

            if (cities.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            cities.forEach(city => {
                const card = createCityCard(city);
                citiesGrid.appendChild(card);
            });
        }

        // 创建城市卡片
        function createCityCard(city) {
            const card = document.createElement('div');
            card.className = 'city-card';

            const score = (city.layflat_score || city.overall_score || 0).toFixed(1);
            const rent = city.avg_rent || '暂无';
            const air = (city.air_quality || 0).toFixed(1);
            const medical = (city.medical_facilities || 0).toFixed(1);
            const employment = (city.employment || 0).toFixed(1);

            // 生成标签
            const tags = [];
            if (city.avg_rent && city.avg_rent < 1000) tags.push('低成本');
            if (city.air_quality >= 7) tags.push('空气好');
            if (city.elderly_care >= 7) tags.push('适合养老');
            if (city.employment >= 7) tags.push('就业好');

            card.innerHTML = `
                <div class="city-card-header">
                    <h3 class="city-card-name">${city.name}</h3>
                    <p class="city-card-location">${city.province || ''}</p>
                </div>
                <div class="city-card-body">
                    <div class="city-card-price">¥${rent}/月</div>
                    <div class="city-card-tags">
                        ${tags.map(tag => `<span class="city-tag">${tag}</span>`).join('')}
                    </div>
                    <div class="city-card-stats">
                        <div class="city-stat">
                            <div class="city-stat-value">${score}</div>
                            <div class="city-stat-label">综合评分</div>
                        </div>
                        <div class="city-stat">
                            <div class="city-stat-value">${air}</div>
                            <div class="city-stat-label">空气质量</div>
                        </div>
                        <div class="city-stat">
                            <div class="city-stat-value">${medical}</div>
                            <div class="city-stat-label">医疗</div>
                        </div>
                    </div>
                </div>
            `;

            card.onclick = () => {
                window.location.href = `city-detail.html?id=${city.id}`;
            };

            return card;
        }

        // 应用筛选
        function applyFilters() {
            filteredCities = allCities.filter(city => {
                // 搜索过滤
                if (activeFilters.search) {
                    const search = activeFilters.search.toLowerCase();
                    const matchName = city.name.toLowerCase().includes(search);
                    const matchProvince = city.province && city.province.toLowerCase().includes(search);
                    if (!matchName && !matchProvince) return false;
                }

                // 预算过滤
                if (activeFilters.budget) {
                    const [min, max] = activeFilters.budget.split('-').map(Number);
                    const rent = city.avg_rent || 0;
                    if (max === 9999) {
                        if (rent < min) return false;
                    } else {
                        if (rent < min || rent > max) return false;
                    }
                }

                // 快速筛选
                if (activeFilters.quickFilter) {
                    const filter = activeFilters.quickFilter;
                    if (filter === 'low-cost' && city.avg_rent > 1500) return false;
                    if (filter === 'elderly' && city.elderly_care < 5) return false;
                    if (filter === 'employment' && city.employment < 5) return false;
                    if (filter === 'air' && city.air_quality < 7) return false;
                    if (filter === 'safety' && city.safety < 7) return false;
                    // coastal 需要标签支持
                }

                return true;
            });

            renderCities(filteredCities);
        }

        // 初始化事件监听
        function initEventListeners() {
            // 搜索功能
            const heroSearchInput = document.getElementById('heroSearchInput');
            const heroSearchBtn = document.getElementById('heroSearchBtn');
            const navSearchInput = document.getElementById('navSearchInput');

            heroSearchBtn.addEventListener('click', () => {
                activeFilters.search = heroSearchInput.value.trim();
                applyFilters();
                document.getElementById('cities').scrollIntoView({ behavior: 'smooth' });
            });

            heroSearchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    heroSearchBtn.click();
                }
            });

            navSearchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    activeFilters.search = navSearchInput.value.trim();
                    applyFilters();
                }
            });

            // 搜索提示
            document.querySelectorAll('.hint-tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    const hint = tag.dataset.hint;
                    heroSearchInput.value = hint;
                    activeFilters.search = hint;
                    applyFilters();
                    document.getElementById('cities').scrollIntoView({ behavior: 'smooth' });
                });
            });

            // 快捷筛选
            document.querySelectorAll('.quick-filters .filter-tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    const filter = tag.dataset.filter;

                    // 切换激活状态
                    document.querySelectorAll('.quick-filters .filter-tag').forEach(t => t.classList.remove('active'));

                    if (activeFilters.quickFilter === filter) {
                        activeFilters.quickFilter = null;
                    } else {
                        tag.classList.add('active');
                        activeFilters.quickFilter = filter;
                    }

                    applyFilters();
                    document.getElementById('cities').scrollIntoView({ behavior: 'smooth' });
                });
            });

            // 轮播控制
            document.getElementById('carouselPrev').addEventListener('click', () => {
                if (carouselIndex > 0) {
                    carouselIndex--;
                    updateCarousel();
                }
            });

            document.getElementById('carouselNext').addEventListener('click', () => {
                const track = document.getElementById('carouselTrack');
                const cards = track.querySelectorAll('.featured-card');
                const totalPages = Math.ceil(cards.length / carouselItemsPerPage);

                if (carouselIndex < totalPages - 1) {
                    carouselIndex++;
                    updateCarousel();
                }
            });

            // 预算筛选
            document.querySelectorAll('.budget-card').forEach(card => {
                card.addEventListener('click', () => {
                    const budget = card.dataset.budget;

                    // 切换激活状态
                    document.querySelectorAll('.budget-card').forEach(c => c.classList.remove('active'));

                    if (activeFilters.budget === budget) {
                        activeFilters.budget = null;
                    } else {
                        card.classList.add('active');
                        activeFilters.budget = budget;
                    }

                    applyFilters();
                });
            });

            // 筛选抽屉
            const filterOverlay = document.getElementById('filterOverlay');
            const filterDrawer = document.getElementById('filterDrawer');
            const filterToggleBtn = document.getElementById('filterToggleBtn');
            const filterDrawerClose = document.getElementById('filterDrawerClose');
            const applyFiltersBtn = document.getElementById('applyFiltersBtn');
            const resetFiltersBtn = document.getElementById('resetFiltersBtn');

            function openFilterDrawer() {
                filterOverlay.classList.add('active');
                filterDrawer.classList.add('active');
            }

            function closeFilterDrawer() {
                filterOverlay.classList.remove('active');
                filterDrawer.classList.remove('active');
            }

            filterToggleBtn.addEventListener('click', openFilterDrawer);
            filterDrawerClose.addEventListener('click', closeFilterDrawer);
            filterOverlay.addEventListener('click', closeFilterDrawer);

            applyFiltersBtn.addEventListener('click', () => {
                applyFilters();
                closeFilterDrawer();
            });

            resetFiltersBtn.addEventListener('click', () => {
                // 清除所有筛选选项
                document.querySelectorAll('.filter-option').forEach(opt => opt.classList.remove('active'));
                activeFilters = {
                    search: '',
                    quickFilter: null,
                    budget: null,
                    rent: null,
                    region: null,
                    tier: null,
                    feature: null
                };
                applyFilters();
                closeFilterDrawer();
            });

            // 筛选选项
            document.querySelectorAll('.filter-option').forEach(option => {
                option.addEventListener('click', () => {
                    const filterType = option.dataset.filterType;
                    const value = option.dataset.value;

                    // 同类型互斥
                    document.querySelectorAll(`[data-filter-type="${filterType}"]`).forEach(opt => {
                        opt.classList.remove('active');
                    });

                    if (activeFilters[filterType] === value) {
                        activeFilters[filterType] = null;
                    } else {
                        option.classList.add('active');
                        activeFilters[filterType] = value;
                    }
                });
            });

            // 登录/注册模态框
            const loginBtn = document.getElementById('loginBtn');
            const loginModal = document.getElementById('loginModal');
            const closeLoginModal = document.getElementById('closeLoginModal');
            const registerModal = document.getElementById('registerModal');
            const closeRegisterModal = document.getElementById('closeRegisterModal');

            loginBtn.addEventListener('click', () => {
                loginModal.classList.add('show');
            });

            closeLoginModal.addEventListener('click', () => {
                loginModal.classList.remove('show');
            });

            closeRegisterModal.addEventListener('click', () => {
                registerModal.classList.remove('show');
            });

            // 点击模态框外部关闭
            loginModal.addEventListener('click', (e) => {
                if (e.target === loginModal) {
                    loginModal.classList.remove('show');
                }
            });

            registerModal.addEventListener('click', (e) => {
                if (e.target === registerModal) {
                    registerModal.classList.remove('show');
                }
            });

            // 窗口大小改变时更新轮播
            window.addEventListener('resize', () => {
                updateCarousel();
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
